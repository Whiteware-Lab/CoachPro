name: Setup Flutter
description: Install Java 17 and Flutter for CoachPro Android builds.

inputs:
  flutter-version:
    description: Pinned Flutter SDK version for reproducible CI.
    required: false
    default: "3.41.6"

runs:
  using: composite
  steps:
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"
        cache: gradle

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: stable
        cache: true

    - name: Flutter doctor
      shell: bash
      run: flutter doctor -v

    - name: Install dependencies
      shell: bash
      run: flutter pub get
