name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string
      publish_release:
        description: "Create/update GitHub Release and upload assets"
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

  build-release:
    name: Build signed Android artifacts
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 30

    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      apk_name: ${{ steps.meta.outputs.apk_name }}
      aab_name: ${{ steps.meta.outputs.aab_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG'. Expected semver like v1.0.0 or v1.0.0-beta.1"
            exit 1
          fi

          VERSION_NAME="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          VERSION_CODE="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f2)"
          APK_NAME="coachpro-${TAG}.apk"
          AAB_NAME="coachpro-${TAG}.aab"

          if [[ "$TAG" == *"-"* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi

          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "apk_name=$APK_NAME"
            echo "aab_name=$AAB_NAME"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Verify Firebase Android config
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing."
            exit 1
          fi

      - name: Verify signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret:-}" ]; then
              echo "::error::Missing required secret: $secret"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure all Android signing secrets before creating a release."
            exit 1
          fi
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Configure Android signing
        uses: ./.github/actions/configure-android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release/${{ steps.meta.outputs.apk_name }}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release/${{ steps.meta.outputs.aab_name }}"
          cp "release/${{ steps.meta.outputs.apk_name }}" release/coachpro.apk

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coachpro-release-${{ steps.meta.outputs.tag }}
          path: release/
          retention-days: 30
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-release
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: coachpro-release-${{ needs.build-release.outputs.tag }}
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-release.outputs.tag }}
          name: CoachPro ${{ needs.build-release.outputs.tag }}
          prerelease: ${{ needs.build-release.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/${{ needs.build-release.outputs.apk_name }}
            release-assets/${{ needs.build-release.outputs.aab_name }}
            release-assets/coachpro.apk
          body: |
            ## CoachPro ${{ needs.build-release.outputs.tag }}

            | | |
            |---|---|
            | Version | `${{ needs.build-release.outputs.version_name }}` (build `${{ needs.build-release.outputs.version_code }}`) |
            | Flutter | `${{ env.FLUTTER_VERSION }}` |

            ### Installazione
            - **APK** — installazione diretta su Android
            - **AAB** — bundle per Google Play Console
